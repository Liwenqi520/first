#应用配置
service_scheme: http
service_ip: 127.0.0.1
service_port: 40000
debug: true
default_lang: "zh-cn"
allow_headers:
  - "Authorization"
  - "Accept-Language"
  - "X-Trace-Id"
allow_methods:
#[MySQL]连接地址
mysql:
  debug: true
  host: "" #host
  port: "" #连接端口
  database: "" #数据库
  username: "" #用户名
  password: "" #密码
  max_lifetime: 3600 #秒
  max_open_conns: 30
  max_idle_conns: 2

#[redis]连接地址
redis:
  host: ""
  port: ""
  protocol: "tcp"
  wait: true

#数据处理时区设置
time_zone: ""
#开放接口参数设置
nbi_device_service:
  device_admin_url: ""
  device_admin_tcp_url: ""
  username: ""
  password: ""
  type: "client"
  is_go_device_admin: true
  timeout: 10800
  allow_ip:
    - "127.0.0.1"
    - "10.16.1.156"
    - "10.16.1.103"
    - "183.15.177.200"


log:
  debug: true
  enable_trace: true
  trace_sample_ratio: 1
  # jaeger_server: http://120.77.213.80:14268/api/traces
  jaeger_username:
  jaeger_password:
  stdout: true
